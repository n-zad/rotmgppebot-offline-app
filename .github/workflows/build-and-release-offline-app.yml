name: Build and release offline app

# Build strategy:
# - run offline_app/build.ps1 on Windows to produce RotMG-PPE-Offline.exe + _internal/
# - zip the full repository (excluding .venv, .build, and cache dirs)
# - upload the extracted tree as a workflow artifact (avoids zip-in-zip downloads)
# - publish the zip as a GitHub Release asset

on:
  push:

permissions:
  contents: write

jobs:
  build-and-release:
    # Pin explicitly; windows-latest/windows-2025 redirect to this image during the VS2026 migration.
    runs-on: windows-2025-vs2026
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build executable
        shell: pwsh
        working-directory: offline_app
        run: ./build.ps1

      - name: Create release zip
        shell: pwsh
        run: |
          $repoRoot = Get-Location
          $zipPath = Join-Path $env:RUNNER_TEMP "rotmg-ppe-offline.zip"
          $stagingRoot = Join-Path $env:RUNNER_TEMP "release-staging"
          $appFolder = Join-Path $stagingRoot "rotmg-ppe-offline"
          $extractDir = Join-Path $env:RUNNER_TEMP "extract-test"
      
          Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
          Remove-Item $stagingRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $extractDir -Recurse -Force -ErrorAction SilentlyContinue
      
          New-Item -ItemType Directory -Force -Path $appFolder | Out-Null
      
          robocopy $repoRoot $appFolder /E `
            /XD .git offline_app\.venv offline_app\.build __pycache__ `
            /XF *.pyc
      
          if ($LASTEXITCODE -le 7) {
            $global:LASTEXITCODE = 0
          } else {
            exit $LASTEXITCODE
          }
      
          tar -a -cf $zipPath -C $stagingRoot "rotmg-ppe-offline"
      
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          tar -xf $zipPath -C $extractDir

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: rotmg-ppe-offline-windows
          path: ${{ runner.temp }}/extract-test
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: offline-app-windows-build-${{ github.run_number }}
          name: RotMG PPE Offline App for Windows (Build ${{ github.run_number }})
          body: |
            Prebuilt RotMG PPE offline/manual-entry app for Windows.

            Download and extract `rotmg-ppe-offline.zip`, then run:

            `rotmg-ppe-offline\offline_app\RotMG-PPE-Offline.exe`

            Source commit: ${{ github.sha }}
          files: ${{ runner.temp }}/rotmg-ppe-offline.zip
          make_latest: true
