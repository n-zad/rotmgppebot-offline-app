name: Sync upstream into fork branches

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/tseringgg/rotmgppebot.git
          git fetch upstream
          git fetch origin

      - name: Update fork main from upstream main
        run: |
          git checkout main
          git merge --ff-only upstream/main
          git push origin main

      - name: Merge main into offline app feature branch
        run: |
          git checkout offline-app
          git merge --no-ff main -m "Merge upstream updates from main"
          git push origin offline-app
